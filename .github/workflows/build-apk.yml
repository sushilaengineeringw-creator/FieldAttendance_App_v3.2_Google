name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: "Central backend (Apps Script) /exec URL (overrides the SERVER_URL repository variable)"
        required: false
      build_aab:
        description: "Also build the signed Play Store bundle (.aab). Needs the 4 signing secrets - see README"
        type: boolean
        default: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Run tests (a failure here is reported but does not stop the APK build)
        continue-on-error: true
        run: npm test

      - name: Set Google Apps Script URL in the app
        env:
          INPUT_URL: ${{ github.event.inputs.server_url }}
          VAR_URL: ${{ vars.SERVER_URL }}
          ALL_VARS: ${{ toJSON(vars) }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
          TERMS_URL: ${{ vars.TERMS_URL }}
        run: |
          URL="${INPUT_URL:-$VAR_URL}"
          if [ -n "$INPUT_URL" ]; then echo "Using URL typed into Run workflow";
          elif [ -n "$VAR_URL" ]; then echo "Using repository variable SERVER_URL"; fi
          if [ -z "$URL" ]; then
            URL=$(node -e "const m=require('fs').readFileSync('www/config.js','utf8').match(/\"?SERVER_URL\"?:\s*\"([^\"]+)\"/);process.stdout.write(m&&!/PASTE-YOUR-ID/.test(m[1])?m[1]:'')")
            [ -n "$URL" ] && echo "Using URL already saved in www/config.js"
          fi
          if [ -z "$URL" ]; then
            echo "Variable names this repository has: $(node -e "console.log(Object.keys(JSON.parse(process.env.ALL_VARS)).join(', ')||'(none)')")"
            echo "::error::No server URL found. Create a repository VARIABLE named exactly SERVER_URL (Settings > Secrets and variables > Actions > Variables), or edit www/config.js and paste your /exec URL, or type it into Run workflow."
            exit 1
          fi
          node scripts/set-server-url.js "$URL"

      - name: Prepare release signing (only when building the AAB)
        if: ${{ github.event.inputs.build_aab == 'true' }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (see README: Play Store bundle)."; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.js
          npm run icons
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed Play Store bundle (AAB)
        if: ${{ github.event.inputs.build_aab == 'true' }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Name the files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Field-Attendance-${{ github.run_number }}.apk
          if [ "${{ github.event.inputs.build_aab }}" = "true" ]; then cp android/app/build/outputs/bundle/release/app-release.aab dist/Field-Attendance-${{ github.run_number }}.aab; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Field-Attendance-Build
          path: dist/*
          retention-days: 30
